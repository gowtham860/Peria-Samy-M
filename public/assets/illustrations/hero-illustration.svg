<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="50" y1="50" x2="550" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="225" r="180" fill="url(#bgGrad)" filter="blur(40px)" />

  <!-- Code/Roadmap Matrix Canvas -->
  <rect x="80" y="60" width="440" height="320" rx="20" fill="#1E293B" stroke="#334155" stroke-width="2" />
  
  <!-- Canvas Header -->
  <circle cx="110" cy="88" r="6" fill="#EF4444" />
  <circle cx="128" cy="88" r="6" fill="#F59E0B" />
  <circle cx="146" cy="88" r="6" fill="#10B981" />
  <rect x="180" y="80" width="180" height="16" rx="8" fill="#334155" />

  <!-- Roadmap Tree Graphic -->
  <!-- Step 1 -->
  <rect x="110" y="130" width="150" height="54" rx="12" fill="#0F172A" stroke="#475569" stroke-width="1.5" />
  <circle cx="132" cy="157" r="12" fill="#10B981" />
  <path d="M128 157L131 160L137 154" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
  <rect x="154" y="146" width="80" height="10" rx="5" fill="#E2E8F0" />
  <rect x="154" y="162" width="50" height="6" rx="3" fill="#64748B" />

  <!-- Connector 1 -->
  <path d="M260 157 L 340 157 L 340 210" stroke="#6366F1" stroke-width="3" stroke-dasharray="4 4" />

  <!-- Step 2 (Active Milestone) -->
  <rect x="260" y="210" width="160" height="60" rx="12" fill="url(#cardGrad)" />
  <circle cx="286" cy="240" r="14" fill="#FFFFFF" />
  <path d="M282 235L292 240L282 245Z" fill="#4F46E5" />
  <rect x="310" y="228" width="90" height="10" rx="5" fill="#FFFFFF" />
  <rect x="310" y="244" width="60" height="8" rx="4" fill="#C7D2FE" />

  <!-- Connector 2 -->
  <path d="M340 270 L 340 310 L 220 310" stroke="#64748B" stroke-width="2" />

  <!-- Step 3 (Future Milestone) -->
  <rect x="140" y="290" width="150" height="54" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <circle cx="162" cy="317" r="12" fill="#334155" />
  <rect x="184" y="306" width="75" height="10" rx="5" fill="#64748B" />
  <rect x="184" y="322" width="45" height="6" rx="3" fill="#475569" />

  <!-- Floating AI Insight Card -->
  <g transform="translate(350, 280)">
    <rect width="180" height="90" rx="14" fill="#0F172A" stroke="#6366F1" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.5))" />
    <circle cx="26" cy="28" r="12" fill="#818CF8" />
    <text x="22" y="33" fill="#FFF" font-size="14" font-weight="bold">✦</text>
    <text x="46" y="32" fill="#F8FAFC" font-size="12" font-weight="700" font-family="sans-serif">AI Tutor Tip</text>
    <rect x="18" y="52" width="144" height="8" rx="4" fill="#475569" />
    <rect x="18" y="66" width="100" height="8" rx="4" fill="#6366F1" />
  </g>
</svg>
